<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skolväder</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header id="main-header">
    <div id="header-box">
      <h1>Väder i Stockholm</h1>
      <p id="updated">--:--</p>
    </div>

    <div class="credit">
      <div class="credit-name">
        Skapad av <strong>Amir Rezai</strong> (TE23A)
      </div>
      <div class="credit-discord">
        Discord: <strong>maximum_amir</strong>
      </div>
    </div>
  </header>

  <main>
    <div id="snow-layer"></div>

    <section id="week-forecast" class="grid"></section>

    <div id="rain-warning">
      <img
        src="Väderläget/paraply vänster.png"
        class="umbrella left"
        alt=""
      >

      <div class="rain-text">TA MED PARAPLY!</div>

      <img
        src="Väderläget/paraply höger.png"
        class="umbrella right"
        alt=""
      >
    </div>

    <!-- Miku till vänster -->
    <div class="miku miku-left">
      <div class="speech">Kolla vädret!</div>
      <img src="Väderläget/miku pratar.png" alt="Miku">
    </div>

    <!-- Miku till höger -->
    <div class="miku miku-right">
      <div class="speech">Its tiiimeeeee! 🎅</div>
      <img src="Väderläget/miku jul.png" alt="Miku i julkläder">
    </div>
  </main>

  <script src="script.js"></script>

</body>
</html>
